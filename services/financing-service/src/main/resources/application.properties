spring.application.name=financing-service
server.port=8083
management.endpoints.web.exposure.include=health,info
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/financing_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:invoiceflow}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:change-this-rabbit-password}
spring.rabbitmq.listener.simple.default-requeue-rejected=false
